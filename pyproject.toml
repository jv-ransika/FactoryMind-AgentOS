[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agent-os"
version = "1.3.0"
description = "A code-first FactoryMind AgentOS package for defining, running, and safely improving reusable agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FactoryMind AgentOS Team" }]
dependencies = [
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "openai-agents>=0.12,<1",
  "hdbscan>=0.8.39,<1",
  "sqlalchemy>=2.0,<3",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5.0,<6",
  "alembic>=1.13,<2",
  "PyJWT>=2.8,<3",
  "cryptography>=43,<45",
  "opentelemetry-api>=1.28,<2",
  "opentelemetry-sdk>=1.28,<2",
  "opentelemetry-exporter-otlp>=1.28,<2",
  "tiktoken>=0.7,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "fakeredis>=2.23,<3",
  "build>=1.2,<2",
  "twine>=5.1,<6",
]

[project.scripts]
agent-os = "agent_os.cli.app:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

