services:
  service:
    build:
      context: .
      dockerfile: Dockerfile
    image: factorymind-agentos:0.1.0-beta.3
    container_name: factorymind-agentos-service-beta
    env_file:
      - .env
    volumes:
      - ./.agent-os:/data/.agent-os
      - ./examples/runtime.beta.json:/data/.agent-os/runtime.json:ro
      - ./examples/auth.beta.json:/data/.agent-os/auth.json:ro
    command: ["agent-os", "serve", "--host", "0.0.0.0", "--port", "8000", "--root", "/data/.agent-os", "--runtime", "local"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    image: factorymind-agentos:0.1.0-beta.3
    container_name: factorymind-agentos-worker-beta
    depends_on:
      service:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./.agent-os:/data/.agent-os
      - ./examples/runtime.beta.json:/data/.agent-os/runtime.json:ro
      - ./examples/auth.beta.json:/data/.agent-os/auth.json:ro
    command: ["agent-os", "worker", "run", "--root", "/data/.agent-os"]

